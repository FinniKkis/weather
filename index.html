<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Leaflet CSS для карты -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Добавляем иконку сайта -->
    <link rel="icon" type="image/x-icon" href="img/Vector (1).svg">
    <link rel="icon" type="image/png" sizes="32x32" href="img/Vector (1).svg">
    <link rel="icon" type="image/png" sizes="16x16" href="img/Vector (1).svg">
    <link rel="apple-touch-icon" sizes="180x180" href="img/Vector (1).svg">
</head>
<body class="bg-gradient-to-br from-blue-400 to-blue-600 min-h-screen">
    <div class="container py-8">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <!-- Карточка приложения -->
                <div class="card shadow-lg border-0 rounded-2xl">
                    <div class="card-body p-6">
                        <!-- Заголовок -->
                        <div class="text-center mb-6">
                            <h1 class="text-3xl font-bold text-gray-800 mb-2">
                                <i class="bi bi-cloud-sun text-blue-500 me-2"></i>
                                Погода
                            </h1>
                            <p class="text-gray-600">Узнайте текущую погоду в любом городе</p>
                        </div>

                        <!-- Навигационные вкладки -->
                        <ul class="nav nav-tabs mb-4" id="weatherTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="search-tab" data-bs-toggle="tab" data-bs-target="#search" type="button" role="tab">
                                    <i class="bi bi-search me-2"></i>Поиск
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="cities-tab" data-bs-toggle="tab" data-bs-target="#cities" type="button" role="tab">
                                    <i class="bi bi-globe me-2"></i>Города мира
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="map-tab" data-bs-toggle="tab" data-bs-target="#map" type="button" role="tab">
                                    <i class="bi bi-geo-alt me-2"></i>Карта погоды
                                </button>
                            </li>
                        </ul>

                        <!-- Содержимое вкладок -->
                        <div class="tab-content" id="weatherTabsContent">
                            <!-- Вкладка поиска -->
                            <div class="tab-pane fade show active" id="search" role="tabpanel">
                                <!-- Форма поиска -->
                                <div class="mb-6">
                                    <div class="input-group">
                                        <input 
                                            type="text" 
                                            id="cityInput" 
                                            class="form-control form-control-lg" 
                                            placeholder="Введите название города..."
                                            onkeypress="handleKeyPress(event)"
                                        >
                                        <button 
                                            id="searchBtn" 
                                            class="btn btn-primary btn-lg px-4"
                                            onclick="getWeather()"
                                        >
                                            <i class="bi bi-search me-2"></i>
                                            Найти
                                        </button>
                                    </div>
                                </div>

                                <!-- Результаты погоды -->
                                <div id="weatherResult" class="text-center" style="display: none;">
                                    <!-- Погодная информация будет здесь -->
                                </div>

                                <!-- Сообщение об ошибке -->
                                <div id="errorMessage" class="alert alert-danger text-center" style="display: none;">
                                    <!-- Сообщения об ошибках будут здесь -->
                                </div>

                                <!-- Спиннер загрузки -->
                                <div id="loadingSpinner" class="text-center" style="display: none;">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Загрузка...</span>
                                    </div>
                                    <p class="text-gray-600 mt-2">Получаем данные о погоде...</p>
                                </div>
                            </div>
                            <!-- Вкладка городов мира -->
                            <div class="tab-pane fade" id="cities" role="tabpanel">
                                <div class="text-center mb-4">
                                    <p class="text-gray-600">Погода и время в крупнейших городах мира</p>
                                </div>
                                
                                <!-- Спиннер загрузки для городов -->
                                <div id="citiesLoading" class="text-center">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Загрузка...</span>
                                    </div>
                                    <p class="text-gray-600 mt-2">Загружаем данные о городах...</p>
                                </div>

                                <!-- Контейнер для городов -->
                                <div id="citiesContainer" class="row g-2" style="display: none;">
                                    <!-- Города будут загружены здесь -->
                                </div>
                            </div>
                            
                            <!-- Вкладка карты погоды -->
                            <div class="tab-pane fade" id="map" role="tabpanel">
                                <div class="text-center mb-4">
                                    <p class="text-gray-600">Интерактивная карта погоды в мире</p>
                                </div>

                                <!-- Элементы управления картой -->
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <div class="input-group">
                                            <input 
                                                type="text" 
                                                id="mapSearch" 
                                                class="form-control" 
                                                placeholder="Найти город на карте..."
                                            >
                                            <button class="btn btn-outline-primary" id="mapSearchBtn">
                                                <i class="bi bi-search"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check form-switch mt-2">
                                            <input class="form-check-input" type="checkbox" id="temperatureLayer" checked>
                                            <label class="form-check-label" for="temperatureLayer">
                                                Показать температуру
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <!-- Контейнер для карты -->
                                <div id="weatherMap" style="height: 400px; border-radius: 12px;" class="border"></div>
                                
                                <!-- Легенда карты -->
                                <div class="mt-3">
                                    <div class="legend bg-white p-2 rounded border">
                                        <small class="text-muted">
                                            <i class="bi bi-info-circle me-1"></i>
                                            Кликните на карту для получения погоды в выбранном месте
                                        </small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Информация о приложении -->
                <div class="text-center mt-4">
                    <p class="text-white text-sm">
                        Используется Open-Meteo API
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS для карты -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Наш JavaScript -->
    <script src="app.js"></script>
    <script src="weather-map.js"></script>
</body>

</html>
